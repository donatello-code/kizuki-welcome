# KIZUKI Store — Render Blueprint
# Deploys both backend (Node.js API) and frontend (React Static Site)
# from a single monorepo using rootDir.

services:
  # ─── Backend: Node.js API ────────────────────────────────
  - type: web
    name: kizuki-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    rootDir: mern-ecommerce/backend
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: RENDER_DISK_PATH
        value: /opt/render/project/src
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: CORS_ORIGIN
        value: https://kizuki-frontend.onrender.com
    disk:
      name: kizuki-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ─── Frontend: React Static Site ─────────────────────────
  - type: static
    name: kizuki-frontend
    env: static
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: mern-ecommerce/frontend
    envVars:
      - key: VITE_BACKEND_URL
        value: https://kizuki-backend.onrender.com
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
