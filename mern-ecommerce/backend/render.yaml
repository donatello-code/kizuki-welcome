services:
  - type: web
    name: kizuki-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    rootDir: mern-ecommerce/backend
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: RENDER_DISK_PATH
        value: /opt/render/project/src
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: CORS_ORIGIN
        value: https://kizuki.vip
    disk:
      name: kizuki-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
